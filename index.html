<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing With Indrapal Kaur: Lifelong Care & Hope</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- Global Styles & Typography --- */
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        h1, h2 {
            color: #1a1a40;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none; /* For anchor tags */
            display: inline-block;
            text-align: center;
        }

        /* --- Color Palette --- */
        :root {
            --primary-blue: #1a1a40; /* Deep Navy/Purple */
            --accent-gold: #FFC700; /* Hope/Urgency */
            --background-light: #f9f9f9;
            --success-green: #28a745;
        }

        /* --- Section 1: Hero --- */
        .hero {
            background-color: var(--primary-blue);
            color: white;
            padding: 80px 0;
            text-align: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('placeholder_indrapal.jpg'); /* IMPORTANT: Replace this URL */
            background-size: cover;
            background-position: center;
        }
        .hero h1 {
            color: white;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        .hero h2 {
            color: #ccc;
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 0;
        }
        .btn-primary {
            background-color: var(--accent-gold);
            color: var(--primary-blue);
            font-size: 22px;
            padding: 18px 40px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 199, 0, 0.5);
        }
        .btn-primary:hover {
            background-color: #e0b200;
            transform: translateY(-2px);
        }

        /* --- General Section Styling --- */
        section {
            padding: 60px 0;
            text-align: center;
        }
        .section-header {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-blue);
        }

        /* --- Section 2: Story --- */
        #story {
            background-color: white;
        }
        .story-text {
            max-width: 800px;
            margin: 30px auto;
            text-align: left;
            font-size: 1.1rem;
            color: #444;
        }
        
        /* --- Section 3: Core Goals (Pillars) --- */
        #pillars {
            background-color: var(--background-light);
        }
        .pillars-grid {
            display: flex;
            gap: 30px;
            margin-top: 40px;
            justify-content: center;
            text-align: left;
        }
        .pillar-card {
            flex: 1;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            background-color: white;
            border-top: 5px solid;
        }
        .pillar-care {
            border-top-color: #1a1a40;
        }
        .pillar-therapy {
            border-top-color: var(--success-green);
        }
        .pillar-card h3 {
            font-size: 1.8rem;
            margin-top: 0;
            color: var(--primary-blue);
        }
        .pillar-card p {
            margin-bottom: 15px;
        }
        .pillar-card .btn {
            padding: 10px 20px;
            font-size: 16px;
        }

        /* --- Section 4 & 5: Action & CTA --- */
        #action {
            background-color: var(--primary-blue);
            color: white;
            padding-bottom: 80px;
        }
        #action h2 {
            color: white;
        }
        .action-grid {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            text-align: center;
        }
        .action-block {
            flex: 1;
            padding: 20px;
            background-color: #2d2d5a;
            border-radius: 8px;
        }
        .action-block h3 {
            color: var(--accent-gold);
        }
        .action-block .btn {
            background-color: var(--accent-gold);
            color: var(--primary-blue);
            margin-top: 15px;
        }

        /* --- Footer --- */
        footer {
            background-color: #111;
            color: #ccc;
            padding: 20px 0;
            font-size: 0.9rem;
        }

        /* --- Responsiveness (Mobile Optimization) --- */
        @media (max-width: 900px) {
            .pillars-grid, .action-grid {
                flex-direction: column;
            }
            .pillar-card, .action-block {
                width: 100%;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .hero h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <p>Hello from Gurjeet</p>

</body>
</html>
